<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Modern CSS spike</title>
<style>
  :root { --brand: #0b7a4b; --pad: 16px; }

  @layer base, theme;
  @layer base { h1 { color: red; } }
  @layer theme { h1 { color: var(--brand); } }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--pad);
    margin-bottom: 24px;
  }
  .grid > div { background: #eef6f1; padding: var(--pad); border: 1px solid var(--brand); }

  .card-host { container-type: inline-size; width: 400px; }
  .card { background: #ddd; padding: 8px; }
  @container (min-width: 300px) {
    .card { background: var(--brand); color: white; }
    .card::after { content: " — container query applied"; }
  }

  .flex { display: flex; justify-content: space-between; margin-top: 24px; }
  .supports::after { content: " @supports NOT detected"; }
  @supports (display: grid) { .supports::after { content: " @supports detected"; } }

  .page2 { break-before: page; }
</style>
</head>
<body>
  <h1>Modern CSS rendering test</h1>
  <div class="grid"><div>grid 1</div><div>grid 2</div><div>grid 3</div></div>
  <div class="card-host"><div class="card">Container query card</div></div>
  <div class="flex"><span>flex left</span><span>flex right</span></div>
  <p class="supports">Feature check:</p>
  <div class="page2"><h2>Page 2 via break-before</h2><p>calc width: <span style="display:inline-block;width:calc(100px + 5em);background:#cde">calc box</span></p></div>
</body>
</html>
